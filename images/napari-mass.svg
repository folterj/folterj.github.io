<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.55  0 0 0 0 0.55  0 0 0 0.5 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="canvas"><rect x="150" y="66" width="300" height="262"/></clipPath>
    <!-- One serial section: tissue inside resin -->
    <g id="section">
      <path d="M -26 -16 L 26 -16 L 30 16 L -30 16 Z" fill="#c9b98f" stroke="#7d6e48" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="14" ry="9" fill="#6b5a3a"/>
    </g>
  </defs>
  <rect width="640" height="360" fill="#eef5f7"/>
  <!-- napari-style window -->
  <rect x="24" y="24" width="592" height="312" rx="10" fill="#262930"/>
  <rect x="24" y="24" width="592" height="30" rx="10" fill="#414851"/>
  <rect x="24" y="44" width="592" height="10" fill="#414851"/>
  <circle cx="44" cy="39" r="5" fill="#e07b39"/><circle cx="62" cy="39" r="5" fill="#e8b23a"/><circle cx="80" cy="39" r="5" fill="#3a9d6b"/>
  <text x="320" y="44" font-size="13" text-anchor="middle" fill="#c9d1d9">wafer overview</text>
  <!-- Layer list -->
  <rect x="34" y="66" width="106" height="262" rx="6" fill="#30343b"/>
  <rect x="42" y="76" width="90" height="26" rx="4" fill="#3a3f47"/>
  <text x="50" y="94" font-size="12" fill="#c9d1d9">wafer</text>
  <rect x="42" y="108" width="90" height="26" rx="4" fill="#3a3f47"/>
  <text x="50" y="126" font-size="12" fill="#c9d1d9">sections</text>
  <rect x="42" y="140" width="90" height="26" rx="4" fill="#4a5361"/>
  <text x="50" y="158" font-size="12" fill="#ffffff">ROIs</text>
  <!-- Wafer with an array of serial sections -->
  <g clip-path="url(#canvas)">
    <rect x="150" y="66" width="300" height="262" fill="#3c4046"/>
    <circle cx="300" cy="197" r="150" fill="#8d9399"/>
    <circle cx="300" cy="197" r="150" fill="#ffffff" filter="url(#grain)"/>
    <g>
      <use href="#section" x="210" y="120"/><use href="#section" x="270" y="120"/><use href="#section" x="330" y="120"/><use href="#section" x="390" y="120"/>
      <use href="#section" x="210" y="172"/><use href="#section" x="270" y="172"/><use href="#section" x="330" y="172"/><use href="#section" x="390" y="172"/>
      <use href="#section" x="210" y="224"/><use href="#section" x="270" y="224"/><use href="#section" x="330" y="224"/><use href="#section" x="390" y="224"/>
      <use href="#section" x="210" y="276"/><use href="#section" x="270" y="276"/><use href="#section" x="330" y="276"/><use href="#section" x="390" y="276"/>
    </g>
    <!-- Annotated section outlines and their matching ROIs -->
    <g fill="none" stroke="#4fc3f7" stroke-width="2.5">
      <path d="M 184 104 L 236 104 L 240 136 L 180 136 Z"/>
      <path d="M 244 104 L 296 104 L 300 136 L 240 136 Z"/>
      <path d="M 304 104 L 356 104 L 360 136 L 300 136 Z"/>
      <path d="M 364 104 L 416 104 L 420 136 L 360 136 Z"/>
      <path d="M 184 156 L 236 156 L 240 188 L 180 188 Z"/>
      <path d="M 244 156 L 296 156 L 300 188 L 240 188 Z"/>
    </g>
    <g fill="#e8b23a" fill-opacity="0.25" stroke="#e8b23a" stroke-width="2">
      <rect x="201" y="113" width="18" height="14"/><rect x="261" y="113" width="18" height="14"/>
      <rect x="321" y="113" width="18" height="14"/><rect x="381" y="113" width="18" height="14"/>
      <rect x="201" y="165" width="18" height="14"/><rect x="261" y="165" width="18" height="14"/>
    </g>
  </g>
  <!-- Acquisition panel -->
  <rect x="460" y="66" width="146" height="262" rx="6" fill="#30343b"/>
  <text x="474" y="92" font-size="13" font-weight="600" fill="#ffffff">MASS</text>
  <g font-size="12">
    <text x="474" y="122" fill="#8fd3e6">sections</text><text x="592" y="122" fill="#c9d1d9" text-anchor="end">16</text>
    <text x="474" y="148" fill="#8fd3e6">annotated</text><text x="592" y="148" fill="#c9d1d9" text-anchor="end">6</text>
    <text x="474" y="174" fill="#8fd3e6">ROIs</text><text x="592" y="174" fill="#c9d1d9" text-anchor="end">6</text>
    <text x="474" y="200" fill="#8fd3e6">order</text><text x="592" y="200" fill="#c9d1d9" text-anchor="end">serial</text>
  </g>
  <rect x="474" y="272" width="118" height="34" rx="6" fill="#3a9d6b"/>
  <text x="533" y="294" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">→ SBEMimage</text>
</svg>
