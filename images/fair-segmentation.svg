<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.6 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- EM-like background and cell -->
  <rect width="640" height="360" fill="#6e7276"/>
  <path d="M 70 180 C 70 70 220 26 340 34 C 480 42 590 110 584 196 C 578 290 450 336 320 330 C 180 324 70 286 70 180 Z" fill="#9a9ea2" stroke="#2f3235" stroke-width="7"/>
  <rect width="640" height="360" fill="#ffffff" filter="url(#grain)"/>
  <!-- Nucleus -->
  <ellipse cx="300" cy="182" rx="92" ry="78" fill="#4f9fd1" fill-opacity="0.55" stroke="#2c6f9c" stroke-width="4"/>
  <ellipse cx="318" cy="168" rx="20" ry="16" fill="#2c6f9c" fill-opacity="0.6"/>
  <!-- Mitochondria -->
  <g stroke-width="3">
    <ellipse cx="160" cy="132" rx="34" ry="14" transform="rotate(-25 160 132)" fill="#e07b39" fill-opacity="0.75" stroke="#a9541d"/>
    <ellipse cx="150" cy="232" rx="30" ry="13" transform="rotate(20 150 232)" fill="#3a9d6b" fill-opacity="0.75" stroke="#24704a"/>
    <ellipse cx="462" cy="110" rx="36" ry="14" transform="rotate(15 462 110)" fill="#e8b23a" fill-opacity="0.8" stroke="#a87d1b"/>
    <ellipse cx="486" cy="200" rx="28" ry="12" transform="rotate(-35 486 200)" fill="#7b5cc4" fill-opacity="0.75" stroke="#523b8f"/>
    <ellipse cx="420" cy="276" rx="34" ry="13" transform="rotate(8 420 276)" fill="#d6567a" fill-opacity="0.75" stroke="#9c3354"/>
    <ellipse cx="236" cy="294" rx="26" ry="11" transform="rotate(-10 236 294)" fill="#3fb5b0" fill-opacity="0.75" stroke="#26807c"/>
    <ellipse cx="246" cy="74" rx="24" ry="10" transform="rotate(10 246 74)" fill="#8bc34a" fill-opacity="0.75" stroke="#5d8a2c"/>
  </g>
  <!-- FAIR badge -->
  <rect x="470" y="300" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.92"/>
  <text x="545" y="326" font-size="15" font-weight="700" text-anchor="middle" fill="#0b6e8a">FAIR · RO-Crate</text>
</svg>
