name: Dr Joost de Folter
title: Data scientist · Research Software Engineer
photo: static/joost.jpg
github_user: folterj
orcid: 0000-0001-9704-2925

bio: >
  Dr Joost de Folter is a multidisciplinary data scientist and Research Software Engineer specialising in
  microscopy data science, machine learning, image analysis, modelling and visualisation. He has extensive
  experience developing automated and reproducible solutions across biomedical research, healthcare and AI.
  At the Francis Crick Institute and through international bioimaging collaborations, he works on data, ML and
  AI projects, large-scale microscopy analysis, deep learning and open science, with a particular interest in
  FAIR data, open standards and translating complex scientific challenges into practical computational solutions.

